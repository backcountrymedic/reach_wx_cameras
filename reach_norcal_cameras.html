<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REACH NorCal — Weather Camera Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; margin: 8px; background-color: #1a1a1a; color: #eee; }

        h1 { font-size: 18px; color: #ff6b35; letter-spacing: 1px; }
        .header {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 10px; border-bottom: 1px solid #444;
            padding-bottom: 6px; flex-wrap: wrap;
        }
        .time-info { font-size: 13px; color: #aaa; }
        .time-info span { margin-right: 16px; }

        /* Section headers */
        .section-label {
            font-size: 11px; font-weight: bold; color: #555;
            text-transform: uppercase; letter-spacing: 1px;
            margin: 12px 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2a2a;
        }

        /* Base tile grid */
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 8px;
        }

        .base-tile {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
        }
        .base-tile:hover {
            border-color: #ff6b35;
            transform: translateY(-2px);
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px;
            background: #0d0d0d;
        }
        .mini-grid img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .tile-label {
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tile-name { font-size: 12px; font-weight: bold; color: #ff6b35; }
        .tile-count { font-size: 10px; color: #555; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

        .modal-box {
            background: #1a1a1a;
            border: 1px solid #ff6b35;
            border-radius: 8px;
            width: 100%;
            max-width: 1100px;
            padding: 16px;
            position: relative;
            margin: auto;
        }

        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px;
        }
        .modal-title { font-size: 16px; font-weight: bold; color: #ff6b35; }
        .modal-close {
            background: #2a2a2a; border: 1px solid #555; border-radius: 4px;
            color: #aaa; font-size: 16px; width: 30px; height: 30px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .modal-close:hover { background: #ff6b35; color: #fff; border-color: #ff6b35; }

        .modal-cam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
        }

        .modal-cam {
            position: relative;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }
        .modal-cam img {
            width: 100%; height: auto; display: block;
            transition: opacity 0.15s;
        }
        .modal-cam:hover img { opacity: 0.8; }
        .modal-cam-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.65);
            font-size: 11px; color: #ddd; padding: 3px 6px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 100%;
            max-height: calc(100vh - 80px);
            object-fit: contain;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .lightbox-label {
            margin-top: 10px;
            font-size: 13px; color: #aaa; text-align: center;
        }
        .lightbox-close {
            position: absolute;
            top: 14px; right: 16px;
            background: #2a2a2a; border: 1px solid #555;
            border-radius: 4px; color: #aaa;
            font-size: 18px; width: 34px; height: 34px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; z-index: 2001;
        }
        .lightbox-close:hover { background: #ff6b35; color: #fff; border-color: #ff6b35; }

        .footer { margin-top: 10px; font-size: 11px; color: #555; }
    </style>
</head>

<div class="header">
    <h1>🚁 REACH NorCal — Weather Cameras</h1>
    <div class="time-info">

<!-- Lightbox -->

    <div class="lightbox-label" id="lightbox-label"></div>
</div>

        { url: "https://pictures.webcamwx.com/KLLR/view_2/current/lo_res_img0.jpg", label: "Ridge ESE" },
        { url: "https://pictures.webcamwx.com/KLLR/view_3/current/lo_res_img0.jpg", label: "South" },
        { url: "https://pictures.webcamwx.com/KLLR/view_4/current/lo_res_img0.jpg", label: "Windsock" },
        { url: "https://pictures.webcamwx.com/KLLR/view_6/current/lo_res_img0.jpg", label: "Main Ramp" },
        { url: "https://pictures.webcamwx.com/KLLR/view_5/current/lo_res_img0.jpg", label: "West" },
        { url: "https://pictures.webcamwx.com/KLLR/view_7/current/lo_res_img0.jpg", label: "West Ramp" },
    ]},
];

function camLabelFromUrl(url) {
    const filename = url.split('/').pop().replace('.jpg','');
    return filename.replace(/^[^_]+_\d+_/, '').replace(/([A-Z])/g, ' $1').trim();
}

function buildTiles(data, gridId, isWcwx) {
    const grid = document.getElementById(gridId);
    data.forEach((base, i) => {
        const tile = document.createElement('div');
        tile.className = 'base-tile';
        tile.onclick = () => openModal(base, isWcwx);
        const preview = isWcwx ? base.imgs.slice(0,6) : base.imgs.slice(0,6);
        const miniImgs = preview.map(img => {
            const url = isWcwx ? img.url + '?' + Date.now() : img;
            return `<img src="${url}" alt="" loading="lazy">`;
        }).join('');
        tile.innerHTML = `
            <div class="mini-grid">${miniImgs}</div>
            <div class="tile-label">
                <span class="tile-name">${base.name}</span>
                <span class="tile-count">${base.imgs.length} cams</span>
            </div>
        `;
        grid.appendChild(tile);
    });
}

function openModal(base, isWcwx) {
    document.getElementById('modal-title').textContent = base.name;
    const grid = document.getElementById('modal-cam-grid');
    grid.innerHTML = base.imgs.map(img => {
        const url = isWcwx ? img.url + '?' + Date.now() : img;
        const label = isWcwx ? img.label : camLabelFromUrl(img);
        return `
            <div class="modal-cam" onclick="openLightbox('${img.url || img}', '${label}')">
                <img src="${url}" alt="${label}" loading="lazy">
                <div class="modal-cam-label">${label}</div>
            </div>
        `;
    }).join('');
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModalBtn() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
}
function closeModal(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModalBtn();
}

function openLightbox(url, label) {
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-label').textContent = label;
    document.getElementById('lightbox').classList.add('open');
}
function closeLightboxBtn() {
    document.getElementById('lightbox').classList.remove('open');
}
function closeLightbox(e) {
    if (e.target === document.getElementById('lightbox')) closeLightboxBtn();
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (document.getElementById('lightbox').classList.contains('open')) {
            closeLightboxBtn();
        } else {
            closeModalBtn();
        }
    }
});

function updateTime() {
    const now = new Date();
    document.getElementById('current-time').textContent = now.toLocaleTimeString();
    const last = localStorage.getItem('reach_norcal_refresh');
    if (last) {
        const diff = Math.floor((now - new Date(last)) / 1000);
        document.getElementById('time-since-refresh').textContent =
            'Last refresh: ' + Math.floor(diff/60) + 'm ' + (diff%60) + 's ago';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    buildTiles(reachData, 'tile-grid-reach', false);
    buildTiles(wcwxData, 'tile-grid-wcwx', true);
    localStorage.setItem('reach_norcal_refresh', new Date().toISOString());
    updateTime();
    setInterval(updateTime, 1000);
});
</script>
